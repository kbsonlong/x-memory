<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X Memory</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <!-- 内联 SVG 图标精灵：同文档 <use> 引用，符合 MV3 CSP -->
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2.6l1.86 5.54 5.54 1.86-5.54 1.86L12 17.4l-1.86-5.54L4.6 10l5.54-1.86z"/><path d="M19 15.5l.7 2.1 2.1.7-2.1.7-.7 2.1-.7-2.1-2.1-.7 2.1-.7z"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></symbol>
      <symbol id="i-footprint" viewBox="0 0 24 24"><path d="M9.2 12.8c-1.9-.8-3-2.9-3-5.2C6.2 5 7.7 3 9.8 3s3.6 2 3.6 4.6c0 2.3-1.1 4.4-3 5.2Z"/><ellipse cx="9.6" cy="17.2" rx="3.1" ry="3.7"/><path d="M16.5 14.4c-1.2-.5-1.9-1.8-1.9-3.2 0-1.9 1-3.3 2.4-3.3s2.4 1.4 2.4 3.3c0 1.4-.7 2.7-1.9 3.2Z"/><ellipse cx="17.1" cy="18.4" rx="2" ry="2.4"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="M16 16l4.2 4.2"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4.5h-4.5"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.8l7.5 3v5.4c0 4.7-3.2 8.3-7.5 10-4.3-1.7-7.5-5.3-7.5-10V5.8z"/><path d="M9 12l2 2 4-4"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-8.5 8.5"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l9.5 16.5H2.5z"/><path d="M12 9v5M12 17.2v.2"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M6.5 18a4.5 4.5 0 0 1-.4-9A6 6 0 0 1 18 9.5a4.3 4.3 0 0 1-.5 8.5z"/><path d="M12 12v5M9.5 14.5L12 12l2.5 2.5"/></symbol>
      <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9Z"/><path d="M10 19a2 2 0 0 0 4 0"/></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M17 6l2 2M14.5 8.5l2 2"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 4h16l2 11v4a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-4z"/><path d="M2 15h5l1.5 3h7L17 15h5"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5L12 15l4.5-4.5"/><path d="M4 17v3h16v-3"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3L10.5 13.5"/><path d="M21 3l-6.8 18-3.7-7.5L3 9.8z"/></symbol>
    </svg>

    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><svg class="ico"><use href="#i-spark"></use></svg></div>
          <div class="brand-copy">
            <p class="eyebrow">X MEMORY</p>
            <h1>你的内容记忆</h1>
          </div>
        </div>
        <div class="header-actions">
          <button id="refresh" class="icon-button" type="button" title="刷新采集" aria-label="刷新采集"><svg class="ico"><use href="#i-refresh"></use></svg></button>
          <button id="theme-toggle" class="icon-button" type="button" title="切换主题" aria-label="切换主题"><svg class="ico"><use href="#i-moon"></use></svg></button>
          <button id="settings-toggle" class="icon-button" type="button" title="打开设置" aria-label="打开设置"><svg class="ico"><use href="#i-gear"></use></svg></button>
        </div>
      </header>

      <div class="status-strip" id="status-strip">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="status">正在读取本地记录…</span>
        <span class="local-badge" id="sync-badge">LOCAL ONLY</span>
      </div>

      <nav class="view-tabs" role="tablist" aria-label="主导航">
        <button class="view-tab active" id="tab-feed" type="button" role="tab" aria-selected="true" aria-controls="feed-view" data-view="feed"><svg class="ico"><use href="#i-list"></use></svg>帖子</button>
        <button class="view-tab" id="tab-digest" type="button" role="tab" aria-selected="false" aria-controls="digest-view" data-view="digest"><svg class="ico"><use href="#i-spark"></use></svg>日报</button>
        <button class="view-tab" id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="settings-panel" data-view="settings"><svg class="ico"><use href="#i-gear"></use></svg>设置</button>
      </nav>

      <main class="main-scroll">
        <!-- ============ FEED ============ -->
        <section id="feed-view" class="view" role="tabpanel" aria-labelledby="tab-feed">
          <section id="summary" class="stats-bar" aria-label="记录统计">
            <div class="stat"><strong data-stat="posts">0</strong><span>帖子</span></div>
            <div class="stat"><strong data-stat="observations">0</strong><span>观察</span></div>
            <div class="stat"><strong data-stat="visits">0</strong><span>访问</span></div>
          </section>

          <label class="search-box">
            <svg class="ico"><use href="#i-search"></use></svg>
            <input id="search" type="search" placeholder="搜索正文、作者或 @handle" autocomplete="off">
            <button id="clear-search" class="clear-button" type="button" aria-label="清除搜索" hidden><svg class="ico ico-sm"><use href="#i-close"></use></svg></button>
          </label>

          <div class="filters" role="tablist" aria-label="记录筛选">
            <button class="filter active" data-filter="all" role="tab" aria-selected="true" type="button">全部</button>
            <button class="filter" data-filter="timeline" role="tab" aria-selected="false" type="button">时间线</button>
            <button class="filter" data-filter="visited" role="tab" aria-selected="false" type="button">已访问</button>
          </div>

          <section class="export-actions" aria-label="导出数据">
            <span>导出本地数据</span>
            <button id="export-json" type="button"><svg class="ico ico-sm"><use href="#i-download"></use></svg>JSON 备份</button>
            <button id="export-csv" type="button"><svg class="ico ico-sm"><use href="#i-download"></use></svg>帖子 CSV</button>
          </section>

          <section id="records" class="records" aria-live="polite"></section>

          <nav id="pagination" class="pagination" aria-label="帖子列表分页" hidden>
            <button id="page-previous" type="button">上一页</button>
            <span id="page-indicator" aria-live="polite"></span>
            <button id="page-next" type="button">下一页</button>
          </nav>
        </section>

        <!-- ============ DIGEST ============ -->
        <section id="digest-view" class="view daily-panel" role="tabpanel" aria-labelledby="tab-digest" hidden aria-label="每日知识日报">
          <div class="daily-heading">
            <div><strong>每日知识日报</strong><span>归纳时间线、访问内容与兴趣方向</span></div>
            <input id="digest-date" type="date" aria-label="日报日期">
          </div>
          <button id="generate-digest" class="digest-button" type="button"><svg class="ico"><use href="#i-spark"></use></svg><span>生成今日日报</span></button>
          <button id="test-digest-push" class="digest-test-button" type="button"><svg class="ico"><use href="#i-send"></use></svg><span>测试推送（总结最近记录）</span></button>
          <div id="digest-push-result" class="push-result" role="status" hidden></div>
          <div id="daily-report" class="daily-report" hidden aria-live="polite"></div>
        </section>

        <!-- ============ SETTINGS ============ -->
        <section id="settings-panel" class="view settings-panel" role="tabpanel" aria-labelledby="tab-settings" hidden>
          <div class="group-card">
            <div class="group-head">
              <div class="group-icon"><svg class="ico"><use href="#i-spark"></use></svg></div>
              <div class="group-title"><strong>AI 总结</strong><span>API Key 仅保存在本机</span></div>
              <span class="state-badge" data-state-for="ai">未配置</span>
            </div>
            <label class="field full"><span>API 地址</span><input id="ai-endpoint" type="url" placeholder="https://api.openai.com/v1/chat/completions"></label>
            <div class="field-grid">
              <label class="field"><span>模型</span><input id="ai-model" type="text" placeholder="gpt-4o-mini"></label>
              <label class="field"><span>API Key</span><span class="input-wrap"><input id="ai-key" type="password" autocomplete="off" placeholder="留空则保留已保存的 Key"><button class="eye-button" type="button" data-eye-for="ai-key" aria-label="显示密钥"><svg class="ico ico-sm"><use href="#i-eye"></use></svg></button></span></label>
            </div>
          </div>

          <div class="group-card">
            <div class="group-head">
              <div class="group-icon group-icon-info"><svg class="ico"><use href="#i-cloud"></use></svg></div>
              <div class="group-title"><strong>S3 同步</strong><span>对象存储需支持 S3 API</span></div>
              <span class="state-badge" data-state-for="s3">未配置</span>
            </div>
            <label class="field full"><span>Endpoint</span><input id="s3-endpoint" type="url" placeholder="https://s3.example.com"></label>
            <div class="field-grid">
              <label class="field"><span>Bucket</span><input id="s3-bucket" type="text"></label>
              <label class="field"><span>Region</span><input id="s3-region" type="text" placeholder="us-east-1"></label>
              <label class="field"><span>Access Key ID</span><input id="s3-access-key" type="text" autocomplete="off"></label>
              <label class="field"><span>Secret Access Key</span><span class="input-wrap"><input id="s3-secret-key" type="password" autocomplete="off" placeholder="留空则保留已保存的密钥"><button class="eye-button" type="button" data-eye-for="s3-secret-key" aria-label="显示密钥"><svg class="ico ico-sm"><use href="#i-eye"></use></svg></button></span></label>
              <label class="field"><span>Session Token（可选）</span><span class="input-wrap"><input id="s3-session-token" type="password" autocomplete="off" placeholder="留空则保留已保存的值"><button class="eye-button" type="button" data-eye-for="s3-session-token" aria-label="显示密钥"><svg class="ico ico-sm"><use href="#i-eye"></use></svg></button></span></label>
              <label class="field"><span>对象前缀</span><input id="s3-prefix" type="text" placeholder="x-memory"></label>
            </div>
          </div>

          <div class="group-card">
            <div class="group-head">
              <div class="group-icon group-icon-visit"><svg class="ico"><use href="#i-bell"></use></svg></div>
              <div class="group-title"><strong>定时与推送</strong><span>浏览器运行时按本地时间执行</span></div>
              <span class="state-badge" data-state-for="schedule">未配置</span>
            </div>
            <label class="check-label"><input id="digest-schedule-enabled" type="checkbox"> 每日生成并推送日报</label>
            <div class="field-grid">
              <label class="field"><span>执行时间</span><input id="digest-schedule-time" type="time" value="09:00"></label>
              <label class="field"><span>Telegram Chat ID</span><input id="telegram-chat-id" type="text" autocomplete="off" placeholder="例如：123456789"></label>
            </div>
            <label class="field full"><span>Webhook URL</span><input id="webhook-url" type="url" placeholder="https://example.com/webhook"></label>
            <label class="field full"><span>Telegram Bot Token</span><span class="input-wrap"><input id="telegram-token" type="password" autocomplete="off" placeholder="留空则保留已保存的 Token"><button class="eye-button" type="button" data-eye-for="telegram-token" aria-label="显示 Token"><svg class="ico ico-sm"><use href="#i-eye"></use></svg></button></span></label>
          </div>

          <div class="group-card">
            <div class="group-head">
              <div class="group-icon group-icon-success"><svg class="ico"><use href="#i-database"></use></svg></div>
              <div class="group-title"><strong>数据管理</strong><span>导出与备份你的本地记忆</span></div>
            </div>
            <div class="data-actions">
              <button id="export-json-alt" type="button"><svg class="ico ico-sm"><use href="#i-download"></use></svg>JSON 备份</button>
              <button id="export-csv-alt" type="button"><svg class="ico ico-sm"><use href="#i-download"></use></svg>帖子 CSV</button>
            </div>
          </div>

          <p class="privacy-note"><svg class="ico"><use href="#i-shield"></use></svg><span>同步会把记录上传到你填写的 S3 存储桶；对象内容未加密。生成日报会把所选日期的时间线和访问帖子正文发送到配置的 AI 服务。</span></p>

          <div class="settings-actions">
            <button id="save-settings" type="button">保存设置</button>
            <button id="sync-now" type="button"><svg class="ico ico-sm"><use href="#i-cloud"></use></svg>立即同步 S3</button>
          </div>
        </section>
      </main>

      <div class="toast-host" id="toast-host" aria-live="polite"></div>
    </div>

    <template id="record-template">
      <article class="record">
        <div class="record-top">
          <span class="type-tag"><svg class="ico ico-sm"><use href="#i-clock"></use></svg><span class="record-type"></span></span>
          <time class="record-time"></time>
        </div>
        <div class="footprint" hidden>
          <svg class="ico ico-fill ico-sm"><use href="#i-footprint"></use></svg>
          <span class="footprint-text"></span>
          <span class="footprint-time"></span>
        </div>
        <div class="record-main">
          <div class="avatar" aria-hidden="true"></div>
          <div class="record-content">
            <div class="author-row">
              <strong class="author-name"></strong>
              <span class="author-handle"></span>
            </div>
            <div class="record-body"></div>
            <button class="more-button" type="button" hidden>展开全文</button>
            <div class="media-grid" hidden></div>
            <div class="record-foot">
              <span class="visit-count"></span>
              <button class="open-button" type="button">打开原帖 <svg class="ico ico-sm"><use href="#i-external"></use></svg></button>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>

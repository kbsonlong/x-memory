<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X Memory</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <p class="eyebrow">X MEMORY</p>
          <h1>你的内容记忆</h1>
        </div>
      </div>
      <div class="header-actions">
        <button id="settings-toggle" class="icon-button" type="button" title="打开设置" aria-label="打开设置">⚙</button>
        <button id="refresh" class="icon-button" type="button" title="刷新列表" aria-label="刷新列表">↻</button>
      </div>
    </header>

    <main>
      <section class="hero" aria-label="本地状态">
        <div>
          <span class="live-dot" aria-hidden="true"></span>
          <span id="status">正在读取本地记录…</span>
        </div>
        <span class="local-badge">LOCAL ONLY</span>
      </section>

      <section id="summary" class="summary" hidden aria-label="记录统计"></section>

      <nav class="view-tabs" role="tablist" aria-label="主导航">
        <button class="view-tab active" id="tab-feed" type="button" role="tab" aria-selected="true" aria-controls="feed-view" data-view="feed">帖子</button>
        <button class="view-tab" id="tab-digest" type="button" role="tab" aria-selected="false" aria-controls="digest-view" data-view="digest">每日日报</button>
        <button class="view-tab" id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="settings-panel" data-view="settings">设置</button>
      </nav>

      <section id="digest-view" class="view daily-panel" role="tabpanel" aria-labelledby="tab-digest" hidden aria-label="每日知识日报">
        <div class="daily-heading">
          <div><strong>每日知识日报</strong><span>归纳时间线、访问内容与兴趣方向</span></div>
          <input id="digest-date" type="date" aria-label="日报日期">
        </div>
        <button id="generate-digest" class="digest-button" type="button">生成今日知识日报</button>
        <button id="test-digest-push" class="digest-test-button" type="button">测试推送（总结最近记录）</button>
        <div id="digest-push-result" class="push-result" role="status" hidden></div>
        <div id="daily-report" class="daily-report" hidden aria-live="polite"></div>
      </section>

      <section id="settings-panel" class="view settings-panel" role="tabpanel" aria-labelledby="tab-settings" hidden>
        <div class="settings-heading"><strong>AI 总结</strong><span>API Key 仅保存在本机</span></div>
        <label>API 地址<input id="ai-endpoint" type="url" placeholder="https://api.openai.com/v1/chat/completions"></label>
        <div class="settings-row">
          <label>模型<input id="ai-model" type="text" placeholder="gpt-4o-mini"></label>
          <label>API Key<input id="ai-key" type="password" autocomplete="off" placeholder="留空则保留已保存的 Key"></label>
        </div>
        <div class="settings-heading"><strong>S3 同步</strong><span>对象存储需支持 S3 API</span></div>
        <label>Endpoint<input id="s3-endpoint" type="url" placeholder="https://s3.example.com"></label>
        <div class="settings-row">
          <label>Bucket<input id="s3-bucket" type="text"></label>
          <label>Region<input id="s3-region" type="text" placeholder="us-east-1"></label>
        </div>
        <label>Access Key ID<input id="s3-access-key" type="text" autocomplete="off"></label>
        <label>Secret Access Key<input id="s3-secret-key" type="password" autocomplete="off" placeholder="留空则保留已保存的密钥"></label>
        <div class="settings-row">
          <label>Session Token（可选）<input id="s3-session-token" type="password" autocomplete="off"></label>
          <label>对象前缀<input id="s3-prefix" type="text" placeholder="x-memory"></label>
        </div>
        <div class="settings-heading"><strong>定时日报</strong><span>浏览器运行时按本地时间执行</span></div>
        <div class="settings-row schedule-row">
          <label class="check-label"><input id="digest-schedule-enabled" type="checkbox"> 每日生成并推送日报</label>
          <label>执行时间<input id="digest-schedule-time" type="time" value="09:00"></label>
        </div>
        <div class="settings-heading"><strong>Webhook 推送</strong><span>可同时配置两种渠道</span></div>
        <label>Webhook URL<input id="webhook-url" type="url" placeholder="https://example.com/webhook"></label>
        <div class="settings-row">
          <label>Telegram Bot Token<input id="telegram-token" type="password" autocomplete="off" placeholder="留空则保留已保存的 Token"></label>
          <label>Telegram Chat ID<input id="telegram-chat-id" type="text" autocomplete="off" placeholder="例如：123456789"></label>
        </div>
        <p class="privacy-note">同步会把记录上传到所填的 S3 存储桶；对象内容未加密。生成日报会把所选日期的时间线和访问帖子正文发送到配置的 AI 服务。</p>
        <div class="settings-actions">
          <button id="save-settings" type="button">保存设置</button>
          <button id="sync-now" type="button">立即同步 S3</button>
        </div>
      </section>

      <section id="feed-view" class="view feed-view" role="tabpanel" aria-labelledby="tab-feed">
        <div class="toolbar">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="搜索正文、作者或标签" autocomplete="off">
          </label>
          <div class="filters" role="tablist" aria-label="记录筛选">
            <button class="filter active" data-filter="all" role="tab" aria-selected="true" type="button">全部</button>
            <button class="filter" data-filter="timeline" role="tab" aria-selected="false" type="button">时间线</button>
            <button class="filter" data-filter="visited" role="tab" aria-selected="false" type="button">已访问</button>
          </div>
        </div>

        <section class="export-actions" aria-label="导出数据">
          <span>导出本地数据</span>
          <button id="export-json" type="button">完整 JSON 备份</button>
          <button id="export-csv" type="button">帖子 CSV</button>
        </section>

        <section id="records" class="records" aria-live="polite"></section>
        <nav id="pagination" class="pagination" aria-label="帖子列表分页" hidden>
          <button id="page-previous" type="button">上一页</button>
          <span id="page-indicator" aria-live="polite"></span>
          <button id="page-next" type="button">下一页</button>
        </nav>
      </section>
    </main>

    <template id="record-template">
      <article class="record">
        <div class="record-topline">
          <span class="record-type"></span>
          <span class="visited-badge" hidden>已访问</span>
          <time class="record-time"></time>
        </div>
        <div class="author-row">
          <div class="avatar" aria-hidden="true"></div>
          <div class="author-copy">
            <strong class="author-name"></strong>
            <span class="author-handle"></span>
          </div>
        </div>
        <div class="record-body"></div>
        <button class="more-button" type="button" hidden>展开全文</button>
        <div class="media-grid" hidden></div>
        <div class="record-footer">
          <span class="visit-count"></span>
          <button class="open-button" type="button">打开原帖 ↗</button>
        </div>
      </article>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>

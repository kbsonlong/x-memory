<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- X Memory icon: a timeline orbit captured into a memory core -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0E9384"/>
    </linearGradient>
  </defs>

  <!-- rounded dark background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- timeline orbit (upper + lower arcs) -->
  <path d="M 108 256 A 148 148 0 0 1 404 256" fill="none" stroke="url(#teal)" stroke-width="26" stroke-linecap="round" opacity="0.35"/>
  <path d="M 404 256 A 148 148 0 0 1 108 256" fill="none" stroke="url(#teal)" stroke-width="26" stroke-linecap="round" opacity="0.35"/>

  <!-- memory core -->
  <circle cx="256" cy="256" r="86" fill="url(#teal)"/>
  <circle cx="256" cy="256" r="32" fill="#0F172A"/>

  <!-- timeline endpoints -->
  <circle cx="108" cy="256" r="24" fill="#2DD4BF"/>
  <circle cx="404" cy="256" r="24" fill="#2DD4BF"/>
</svg>
